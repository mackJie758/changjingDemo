    /* 流程起点和终点 */
    .flow-start-node, .flow-end-node {

    /* ===== 2. 实心核心圆圈 (内层) ===== */
    .circle-icon ,.circle-icon-end {
        position: relative;
        font-size: 21px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;

        /* 内部深色晕染，模拟图2实心圆的厚度感 */
        box-shadow: inset 0 -4px 8px rgba(0,0,0,0.15);
        z-index: 2;
    }

    /*开始 的三角控制*/
    .play-icon {
        display: inline-block;        /* transform 对行内元素无效，必须先转块级 */
        transform: translate(1px, 0px);
    }
    /*结束的 正方形控制*/
    .stop-icon {
        display: inline-block;        /* transform 对行内元素无效，必须先转块级 */
        transform: translate(0px, -4px);
    }

    /* 实心圆渐变 */
    .green-gradient {
        background: linear-gradient(160deg, #2dd4a6 0%, #0d9e74 100%);
    }
    .red-gradient {
        background: linear-gradient(160deg, #f96a8d 0%, #c92a4f 100%);
    }


    /* ===== 3. ★ 核心空心圆边框 (外两层) ===== */
    /*
       ★ 第一层空心圆：
       利用 border 和 outline 制作紧贴实心圆的 白圈
    */
    .circle-icon::before {
        content: '';
        position: absolute;
        inset: -5px; /* 往外偏移 5px */
        border-radius: 50%;
        z-index: 1;

        /* 1. 替换 border，改用圆锥渐变 + 遮罩画圆环 */
        background: conic-gradient(
                from 0deg,
                rgba(13, 158, 116, 1) 0%,      /* 起始颜色 (你可以改成 #0d9e74 或 #fff) */
                transparent 60%, /* 大部分保持透明 */
                rgba(13, 158, 116, 0.6) 100%     /* 结尾颜色 */
        );

        /* 2. 遮罩：挖空圆心，只保留圆环外圈 */
        -webkit-mask: radial-gradient(transparent 66%, #000 70%);
        mask: radial-gradient(transparent 66%, #000 70%);

        /* 3. 动画：匀速循环旋转 */
        animation: borderSpin 3s linear infinite;
    }


    /*
       ★ 第二层空心圆：
       在伪元素 ::after 里再次加一个白框
    */
    .circle-icon::after {
        content: '';
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        z-index: 0;  /* ← 改回0，放在实心圆下方 */

        background: conic-gradient(
                from 180deg,
                rgba(13, 158, 116, 1) 0%,
                transparent 60%,
                rgba(13, 158, 116, 0.6) 100%
        );

        /* 加宽圆环：65%到80%，宽度15% */
        -webkit-mask: radial-gradient(transparent 65%, #000 80%);
        mask: radial-gradient(transparent 65%, #000 80%);

        animation: borderSpinAfter 5s linear infinite ;
    }

    /*结束的第一层*/
    .circle-icon-end::before {
        content: '';
        position: absolute;
        inset: -5px; /* 往外偏移 5px */
        border-radius: 50%;
        z-index: 1;

        /* 1. 替换 border，改用圆锥渐变 + 遮罩画圆环 */
        background: conic-gradient(
                from 0deg,
                rgba(201, 42, 79, 1) 0%,      /* 起始颜色 (你可以改成 #0d9e74 或 #fff) */
                transparent 60%, /* 大部分保持透明 */
                rgba(201, 42, 79, 0.6) 100%     /* 结尾颜色 */
        );

        /* 2. 遮罩：挖空圆心，只保留圆环外圈 */
        -webkit-mask: radial-gradient(transparent 66%, #000 70%);
        mask: radial-gradient(transparent 66%, #000 70%);

        /* 3. 动画：匀速循环旋转 */
        animation: borderSpin 3s linear infinite;
    }


    /*
       ★ 第二层空心圆：
       在伪元素 ::after 里再次加一个白框
    */
    .circle-icon-end::after {
        content: '';
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        z-index: 0;  /* ← 改回0，放在实心圆下方 */

        background: conic-gradient(
                from 180deg,
                rgba(201, 42, 79, 1) 0%,
                transparent 60%,
                rgba(201, 42, 79, 0.6) 100%
        );

        /* 加宽圆环：65%到80%，宽度15% */
        -webkit-mask: radial-gradient(transparent 65%, #000 80%);
        mask: radial-gradient(transparent 65%, #000 80%);

        animation: borderSpinAfter 5s linear infinite ;
    }

    /* ===== 旋转动画关键帧 ===== */
    /*第一层*/
    @keyframes borderSpin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }
    /*第二层*/
    @keyframes borderSpinAfter {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* 竖线设置 */

    .tag-command-main{
        position: relative;
        --top-line-height: 113px;
        --bottom-line-height: 356px;
        --line-offset-right: 219px; /* 竖线向右偏移量，可调节 */
    }
    /* 完整竖线 - 上下连在一起 */
    .tag-command-main::before {
        content: '';
        position: absolute;
        /* 替换原来 left: calc(142%)，改用固定向右偏移 */
        left: 100%; /* 贴紧父容器右边缘 */
        margin-left: 98px; /* 固定向右42px，代替142%的浮动效果 */
        top: calc(-1 * var(--top-line-height));
        transform: translateX(-50%);
        width: 0;
        height: calc(var(--top-line-height) + 1px + var(--bottom-line-height));
        background-color: rgba(39, 168, 163, 1);
        z-index: 1;
    }
    /* 隐藏原来的下方竖线 */
    .tag-command-main::after {
        display: none;
    }

    /* 竖线设置 */

    .tag-mide-main{
        position: relative;
        --top-line-height: 109px;
        --bottom-line-height: 41px;

    }
    /* 完整竖线 - 上下连在一起 */
    .tag-mide-main::before {
        content: '';
        position: absolute;
        left: 100%;
        margin-left: 53px;
        top: calc(-1 * var(--top-line-height)) ;
        transform: translateX(-50%);
        width: 0;
        height: calc(var(--top-line-height) + 1px + var(--bottom-line-height));
        background-color: rgba(39, 168, 163, 1);
        z-index: 1;
    }



    /* 隐藏原来的下方竖线 */

        // 更新时钟
        updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");
            const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            this.currentDate = `${year}年${month}月${day}日`;
            this.currentWeek = weekDays[now.getDay()];
            this.currentTime = `${hours}:${minutes}:${seconds}`;
        },

		// 获取年月日
		getNowTimeStr() {
			const date = new Date();
			const y = date.getFullYear();
			const m = String(date.getMonth() + 1).padStart(2, '0');
			const d = String(date.getDate()).padStart(2, '0');
			return `${y}-${m}-${d}`;
		},
        // 获取当前时间  周一和 下周周日的时间
        getWeekStartAndEnd(){
            const now = new Date();
            const currentDay = now.getDay();
            const mondayOffset = currentDay === 0 ? -6 : 1 - currentDay;

            const monday = new Date(now);
            monday.setDate(now.getDate() + mondayOffset);

            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            const formatDate = (date) =>{
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2,'0');
                const d = String(date.getDate()).padStart(2,'0');
                return `${y}-${m}-${d}`;
            };

            return {
                monday: formatDate(monday),
                sunday: formatDate(sunday)
            };
        },

            // 角标点击事件 - 显示列表弹窗
            handleBadgeClick(event, title, list) {
                event.stopPropagation();
                if (!list || list.length === 0) return;
                // 获取被点击角标所在的父级 flow-node
                const badge = event.target;
                const flowNode = badge.closest(".tag-1");
                const nodeRect = flowNode.getBoundingClientRect();
                const flowModule = document.querySelector(".middle-content");
                const flowRect = flowModule.getBoundingClientRect();

                this.popupTitle = title + " - 列表";
                this.popupList = list;
                this.currentPopupPage = 1;
                this.popupStyle = {
                top: nodeRect.top - flowRect.top + "px",
                left: nodeRect.right - flowRect.left + 12 + "px",
                };
                this.popupVisible = true;
            },
             // 关闭弹窗
            closePopup() {
                this.popupVisible = false;
                this.popupList = [];
                this.currentPopupPage = 1;
            },
            // 分页切换
            changePopupPage(page) {
                this.currentPopupPage = page;
            },
            // 弹窗列表项点击
            handlePopupItemClick(event, item) {
                event.stopPropagation();
