    * {

    html,

    /* 流程起点和终点 */
    .flow-start-node, .flow-end-node {
        position: relative;
        z-index: 10;
        width: 80px;
        height: 80px;
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: default;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }


    /* ===== 2. 实心核心圆圈 (内层) ===== */
    .circle-icon ,.circle-icon-end {
        position: relative;
        font-size: 21px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        margin-bottom: 6px;
        /* 内部深色晕染，模拟图2实心圆的厚度感 */
        box-shadow: inset 0 -4px 8px rgba(0,0,0,0.15);
        z-index: 2;
    }

    /*开始 的三角控制*/
    .play-icon {
        display: inline-block;        /* transform 对行内元素无效，必须先转块级 */
        transform: translate(1px, 0px);
    }
    /*结束的 正方形控制*/
    .stop-icon {
        display: inline-block;        /* transform 对行内元素无效，必须先转块级 */
        transform: translate(0px, -4px);
    }

    /* 实心圆渐变 */
    .green-gradient {
        background: linear-gradient(160deg, #2dd4a6 0%, #0d9e74 100%);
    }
    .red-gradient {
        background: linear-gradient(160deg, #f96a8d 0%, #c92a4f 100%);
    }


    /* ===== 3. ★ 核心空心圆边框 (外两层) ===== */
    /*
       ★ 第一层空心圆：
       利用 border 和 outline 制作紧贴实心圆的 白圈
    */
    .circle-icon::before {
        content: '';
        position: absolute;
        inset: -5px; /* 往外偏移 5px */
        border-radius: 50%;
        z-index: 1;

        /* 1. 替换 border，改用圆锥渐变 + 遮罩画圆环 */
        background: conic-gradient(
                from 0deg,
                rgba(13, 158, 116, 1) 0%,      /* 起始颜色 (你可以改成 #0d9e74 或 #fff) */
                transparent 60%, /* 大部分保持透明 */
                rgba(13, 158, 116, 0.6) 100%     /* 结尾颜色 */
        );

        /* 2. 遮罩：挖空圆心，只保留圆环外圈 */
        -webkit-mask: radial-gradient(transparent 66%, #000 70%);
        mask: radial-gradient(transparent 66%, #000 70%);

        /* 3. 动画：匀速循环旋转 */
        animation: borderSpin 3s linear infinite;
    }


    /*
       ★ 第二层空心圆：
       在伪元素 ::after 里再次加一个白框
    */
    .circle-icon::after {
        content: '';
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        z-index: 0;  /* ← 改回0，放在实心圆下方 */

        background: conic-gradient(
                from 180deg,
                rgba(13, 158, 116, 1) 0%,
                transparent 60%,
                rgba(13, 158, 116, 0.6) 100%
        );

        /* 加宽圆环：65%到80%，宽度15% */
        -webkit-mask: radial-gradient(transparent 65%, #000 80%);
        mask: radial-gradient(transparent 65%, #000 80%);

        animation: borderSpinAfter 5s linear infinite ;
    }

    /*结束的第一层*/
    .circle-icon-end::before {
        content: '';
        position: absolute;
        inset: -5px; /* 往外偏移 5px */
        border-radius: 50%;
        z-index: 1;

        /* 1. 替换 border，改用圆锥渐变 + 遮罩画圆环 */
        background: conic-gradient(
                from 0deg,
                rgba(201, 42, 79, 1) 0%,      /* 起始颜色 (你可以改成 #0d9e74 或 #fff) */
                transparent 60%, /* 大部分保持透明 */
                rgba(201, 42, 79, 0.6) 100%     /* 结尾颜色 */
        );

        /* 2. 遮罩：挖空圆心，只保留圆环外圈 */
        -webkit-mask: radial-gradient(transparent 66%, #000 70%);
        mask: radial-gradient(transparent 66%, #000 70%);

        /* 3. 动画：匀速循环旋转 */
        animation: borderSpin 3s linear infinite;
    }


    /*
       ★ 第二层空心圆：
       在伪元素 ::after 里再次加一个白框
    */
    .circle-icon-end::after {
        content: '';
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        z-index: 0;  /* ← 改回0，放在实心圆下方 */

        background: conic-gradient(
                from 180deg,
                rgba(201, 42, 79, 1) 0%,
                transparent 60%,
                rgba(201, 42, 79, 0.6) 100%
        );

        /* 加宽圆环：65%到80%，宽度15% */
        -webkit-mask: radial-gradient(transparent 65%, #000 80%);
        mask: radial-gradient(transparent 65%, #000 80%);

        animation: borderSpinAfter 5s linear infinite ;
    }

    /* ===== 旋转动画关键帧 ===== */
    /*第一层*/
    @keyframes borderSpin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }
    /*第二层*/
    @keyframes borderSpinAfter {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }




    /* ===== 4. 底部文字 ===== */
    .node-label {
